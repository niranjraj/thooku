name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build skill zip
        run: cd skills && zip -r ../thooku.zip thooku
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" thooku.zip --clobber \
            || gh release create "$GITHUB_REF_NAME" thooku.zip --title "thooku $GITHUB_REF_NAME" --generate-notes
